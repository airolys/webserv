    <h2>
        Un Form envoyant un fichier chunked
    </h2>
    <form method="post" action="filetest" enctype="multipart/form-data">
        <div>
          <label for="file">Choisir un fichier</label>
          <input type="file" id="file" name="myFile" />
        </div>
        <div>
          <button>Envoyer le fichier</button>
        </div>
      </form>
      <h2>
        Un Form envoyant des informations dans le body
      </h2>
      <form action="YOUR_SERVER_ENDPOINT" method="POST">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <input type="submit" value="Submit">
    </form>
